services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: forgeops-api:local
    container_name: forgeops-api
    environment:
      FORGEOPS_API_HOST: 0.0.0.0
      FORGEOPS_API_PORT: 8000
      FORGEOPS_CORS_ORIGINS: http://localhost:3000,http://web:3000
      FORGEOPS_DATA_DIR: /data
      FORGEOPS_EXTRACT_DIR: /data/extracted
    ports:
      - "8000:8000"
    volumes:
      - forgeops-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    image: forgeops-web:local
    container_name: forgeops-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  forgeops-data:
